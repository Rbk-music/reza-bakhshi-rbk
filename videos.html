<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ---- burger menu ---- */
const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
burger.addEventListener('click', () => navLinks.classList.toggle('open'));

/* =========================================================
   THE FULL VIDEO LIBRARY. Add as many videos as you want here.

   src: EITHER a full link (like your reza-board worker link)
   OR a relative path to a file next to this html file, e.g.
   "videos/track1.mp4" (put the actual file in a "videos" folder).
   category: must match one of the "key" values in CATEGORIES below.
========================================================= */
const CATEGORIES = [
  { key: "all",     label: "همه" },
  { key: "official",label: "موزیک ویدیو" },
  { key: "remix",   label: "ریمیکس" },
  { key: "bts",     label: "پشت صحنه" },
  { key: "old",     label: "قدیمی" }
];

const VIDEOS = [
  { title: "Moonlight — Official Video", src: "", category: "official" },
  { title: "Eclipse — Visualizer", src: "", category: "remix" },
  { title: "Beyond — Behind the Scenes", src: "", category: "bts" },
  { title: "Video 4", src: "", category: "official" },
  { title: "Video 5", src: "", category: "remix" },
  { title: "Video 6", src: "", category: "old" }
];

/* ---- category tabs ---- */
const catTabs = document.getElementById('catTabs');
let activeCat = 'all';
CATEGORIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab' + (c.key === 'all' ? ' active' : '');
  btn.textContent = c.label;
  btn.addEventListener('click', () => {
    activeCat = c.key;
    catTabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderVideos();
  });
  catTabs.appendChild(btn);
});

/* ---- render video grid (filterable) ---- */
const videoGrid = document.getElementById('videoGrid');
function renderVideos(){
  videoGrid.innerHTML = '';
  VIDEOS.forEach(v => {
    if (activeCat !== 'all' && v.category !== activeCat) return;
    const catLabel = (CATEGORIES.find(c => c.key === v.category) || {}).label || '';
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <div class="frame-wrap">
        <video src="${v.src}" controls preload="metadata"></video>
      </div>
      <div class="vt">
        <span>${v.title}<span class="cat">${catLabel}</span></span>
        <a class="dl-btn" href="${v.src}" download title="Download" aria-label="Download ${v.title}">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17l-4.7-5.3 1.4-1.4 3.3 3.3V3zM5 19h14v2H5z"/></svg>
        </a>
      </div>`;
    videoGrid.appendChild(card);
  });
}
renderVideos();
</script>
