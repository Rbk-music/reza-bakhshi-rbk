<script>
document.getElementById('year').textContent = new Date().getFullYear();

/* ---- burger menu ---- */
const burger = document.getElementById('burger');
const navLinks = document.getElementById('navLinks');
burger.addEventListener('click', () => navLinks.classList.toggle('open'));

/* =========================================================
   EDIT THESE LISTS to add your own short texts / do-beyti /
   quotes. Add as many as you like, and give each one one or
   more categories from CATEGORIES below.
========================================================= */
const CATEGORIES = [
  { key: "all",          label: "همه" },
  { key: "doubeyti",     label: "دوبیتی" },
  { key: "quote",        label: "جملات خاص" },
  { key: "love",         label: "عاشقانه" },
  { key: "sad",          label: "غمگین" },
  { key: "motivational", label: "انگیزشی" }
];

const QUOTES = [
  { text: "تورا جانم صدا کردم ‌ولیکن برتر از جانی مگر جان بی تو میماند در این تندیس انسانی", author: "", category: ["love"] },
  { text: "یه جمله‌ی خاص دیگه اینجا بنویس", author: "", category: ["quote", "motivational"] },
  { text: "یه دوبیتی یا جمله‌ی عاشقانه اینجا بنویس", author: "", category: ["doubeyti", "love"] }
];

/* ---- category tabs ---- */
const catTabs = document.getElementById('catTabs');
let activeCat = 'all';
CATEGORIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab' + (c.key === 'all' ? ' active' : '');
  btn.textContent = c.label;
  btn.addEventListener('click', () => {
    activeCat = c.key;
    catTabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderQuotes();
  });
  catTabs.appendChild(btn);
});

/* ---- render quote grid (filterable) ---- */
const quoteGrid = document.getElementById('quoteGrid');
function renderQuotes(){
  quoteGrid.innerHTML = '';
  QUOTES.forEach(q => {
    if (activeCat !== 'all' && !q.category.includes(activeCat)) return;
    const card = document.createElement('div');
    card.className = 'quote-card';
    card.innerHTML = `
      <p class="quote-text">${q.text}</p>
      ${q.author ? `<span class="quote-author">— ${q.author}</span>` : ''}
    `;
    quoteGrid.appendChild(card);
  });
}
renderQuotes();
</script>
