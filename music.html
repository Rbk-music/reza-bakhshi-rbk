/* ---- category tabs ---- */
const catTabs = document.getElementById('catTabs');
let activeCat = 'all';
CATEGORIES.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab' + (c.key === 'all' ? ' active' : '');
  btn.textContent = c.label;
  btn.addEventListener('click', () => {
    activeCat = c.key;
    catTabs.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTracks();
  });
  catTabs.appendChild(btn);
});

/* ---- render track grid (filterable) ---- */
const trackGrid = document.getElementById('trackGrid');
function renderTracks(){
  trackGrid.innerHTML = '';
  TRACKS.forEach((t, i) => {
if (activeCat !== 'all' && !t.category.includes(activeCat)) return;
    const card = document.createElement('div');
    card.className = 'track-card';
    card.style.setProperty('--cover1', t.cover1);
    card.style.setProperty('--cover2', t.cover2);
    card.innerHTML = `
      <div class="track-cover">
        ${t.cover ? `<img src="${t.cover}" alt="${t.title} cover">` : ''}
        <div class="play-dot"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="track-info">
        <div>
          <div class="name">${t.title}</div>
          <div class="artist">${t.artist || 'Reza Bakhshi RBK'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="len">${t.duration}</div>
          <a class="dl-btn" href="${t.src}" download title="Download" aria-label="Download ${t.title}">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17l-4.7-5.3 1.4-1.4 3.3 3.3V3zM5 19h14v2H5z"/></svg>
          </a>
        </div>
      </div>`;
    card.querySelector('.track-cover').addEventListener('click', () => playTrack(i));
    card.querySelector('.dl-btn').addEventListener('click', e => e.stopPropagation());
    trackGrid.appendChild(card);
  });
}
renderTracks();

/* ---- player logic ---- */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const volume = document.getElementById('volume');
const heartBtn = document.getElementById('heartBtn');
let current = 0;
let liked = false;

function fmt(s){
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ":" + String(sec).padStart(2,'0');
}

function playTrack(i){
  current = i;
  const t = TRACKS[i];
  document.getElementById('playerTitle').textContent = t.title;
  document.getElementById('playerArtist').textContent = t.artist || 'Reza Bakhshi RBK';
  if (t.src){
    audio.src = t.src;
    audio.play().catch(()=>{});
    setPlayIcon(true);
  } else {
    setPlayIcon(false);
    alert("این آهنگ هنوز فایل ندارد. یک فایل mp3 به پوشه music اضافه کن و مسیرش را در لیست TRACKS داخل کد بنویس.");
  }
}

function setPlayIcon(isPlaying){
  playBtn.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}

playBtn.addEventListener('click', () => {
  if (!audio.src){ playTrack(current); return; }
  if (audio.paused){ audio.play(); setPlayIcon(true); }
  else { audio.pause(); setPlayIcon(false); }
});

document.getElementById('nextBtn').addEventListener('click', () => playTrack((current+1) % TRACKS.length));
document.getElementById('prevBtn').addEventListener('click', () => playTrack((current-1+TRACKS.length) % TRACKS.length));

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  seek.value = (audio.currentTime / audio.duration) * 100;
  curTime.textContent = fmt(audio.currentTime);
  durTime.textContent = fmt(audio.duration);
});
seek.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (seek.value/100) * audio.duration;
});
volume.addEventListener('input', () => audio.volume = volume.value);
audio.volume = 0.8;

heartBtn.addEventListener('click', () => {
  liked = !liked;
  heartBtn.textContent = liked ? '♥' : '♡';
  heartBtn.classList.toggle('on', liked);
});
